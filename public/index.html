<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%PUBLIC_URL%/logo192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7B2D8E" />
    <meta name="description" content="Plumfolio - Personal Finance Tracker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
    <title>Plumfolio</title>
    <!-- SPA redirect handler for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          var path = l.pathname;
          // Remove trailing slash only if path is longer than /Plumfolio/
          if (path.endsWith('/') && path.length > 1) {
            path = path.slice(0, -1);
          }
          window.history.replaceState(null, null,
              path + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        background: #0a0a0f; 
        font-family: 'DM Sans', -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- Instant loading screen - shows before React JS loads -->
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0a0a0f;flex-direction:column;gap:16px">
        <img src="%PUBLIC_URL%/logo192.png" alt="" width="56" height="56" style="border-radius:12px;animation:pulse 1.5s ease-in-out infinite" />
        <div style="color:rgba(255,255,255,0.3);font-size:13px;font-family:'DM Sans',sans-serif;letter-spacing:1px">PLUMFOLIO</div>
        <style>@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}</style>
      </div>
    </div>
  </body>
</html>
